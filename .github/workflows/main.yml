name: Construir Executavel Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl plotly streamlit pyinstaller

    - name: Compilar aplicativo com PyInstaller (Versão Blindada)
      shell: pwsh
      run: |
        pyinstaller --noconfirm --onefile --copy-metadata streamlit --copy-metadata altair --copy-metadata click --add-data "app.py;." --hidden-import="streamlit.web.cli" -c -e "import sys; from streamlit.web.cli import main; sys.argv=['streamlit', 'run', 'app.py', '--global.developmentMode=false']; sys.exit(main())"

    - name: Compactar Executavel
      run: |
        Compress-Archive -Path dist\* -DestinationPath InsightDoc-Limpezas.zip

    - name: Salvar Artefato (Baixar .zip)
      uses: actions/upload-artifact@v4
      with:
        name: App-Executavel-Windows
        path: InsightDoc-Limpezas.zip
