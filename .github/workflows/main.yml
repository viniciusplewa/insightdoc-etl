name: Construir Executavel Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl plotly streamlit pyinstaller

    - name: Criar run_app.py com seguranca (PowerShell)
      shell: pwsh
      run: |
        $content = @"
        import os
        import sys
        import streamlit.web.cli as stcli

        if __name__ == '__main__':
            script_path = os.path.join(os.path.dirname(__file__), "app.py")
            sys.argv = ["streamlit", "run", script_path, "--global.developmentMode=false"]
            sys.exit(stcli.main())
        "@
        Set-Content -Path run_app.py -Value $content -Encoding UTF8

    - name: Compilar com PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "app.py;." --collect-metadata streamlit --collect-metadata altair --collect-metadata click run_app.py

    - name: Compactar pasta do Executavel
      run: |
        Compress-Archive -Path dist\run_app.exe -DestinationPath InsightDoc-Limpezas.zip

    - name: Salvar Artefato (Baixar .zip)
      uses: actions/upload-artifact@v4
      with:
        name: App-Executavel-Windows
        path: InsightDoc-Limpezas.zip
