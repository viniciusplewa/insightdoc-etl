name: Construir Executavel Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl plotly streamlit pyinstaller

    - name: Criar inicializador direto (launcher.py)
      shell: pwsh
      run: |
        $content = @"
        import os
        import sys
        from streamlit.web.bootstrap import run

        if __name__ == '__main__':
            # Descobre se está rodando como executável compilado ou script normal
            if getattr(sys, 'frozen', False):
                # Pega o diretório real onde o executável está na máquina do usuário
                base_path = os.path.dirname(sys.executable)
            else:
                base_path = os.path.dirname(__file__)

            # Caminho absoluto garantido para o app.py na mesma pasta
            target_script = os.path.join(base_path, "app.py")

            # Inicializa o servidor do Streamlit programaticamente ignorando conflitos de CLI
            os.chdir(base_path)
            sys.argv = ["streamlit", "run", target_script, "--global.developmentMode=false"]
            
            run(target_script, False, [])
        "@
        Set-Content -Path launcher.py -Value $content -Encoding UTF8

    - name: Compilar com PyInstaller (Modo Pasta Confiável)
      run: |
        pyinstaller --noconfirm --onedir --copy-metadata streamlit --copy-metadata altair --copy-metadata click launcher.py

    - name: Inserir o app.py na pasta de distribuicao
      shell: pwsh
      run: |
        Copy-Item "app.py" -Destination "dist\launcher\" -Force

    - name: Compactar para ZIP
      run: |
        Compress-Archive -Path dist\launcher -DestinationPath InsightDoc-Limpezas.zip

    - name: Salvar Artefato (Baixar .zip)
      uses: actions/upload-artifact@v4
      with:
        name: App-Executavel-Windows
        path: InsightDoc-Limpezas.zip
