name: Construir Executavel Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl plotly streamlit pyinstaller

    - name: Criar script de inicializacao (run_app.py)
      shell: pwsh
      run: |
        $content = @"
        import os
        import sys
        import streamlit.web.cli as stcli

        if __name__ == '__main__':
            # Descobre onde o executável ou script está localizado
            if getattr(sys, 'frozen', False):
                base_path = os.path.dirname(sys.executable)
            else:
                base_path = os.path.dirname(__file__)
            
            # Força o diretório de trabalho atual para o local dos arquivos
            os.chdir(base_path)
            
            script_path = os.path.join(base_path, "app.py")
            
            sys.argv = [
                "streamlit",
                "run",
                script_path,
                "--global.developmentMode=false",
            ]
            sys.exit(stcli.main())
        "@
        Set-Content -Path run_app.py -Value $content -Encoding UTF8

    - name: Compilar com PyInstaller (Modo Pasta / Onedir)
      run: |
        pyinstaller --noconfirm --onedir --copy-metadata streamlit --copy-metadata altair --copy-metadata click --add-data "app.py;." run_app.py

    - name: Compactar Pasta do Executavel
      run: |
        Compress-Archive -Path dist\run_app -DestinationPath InsightDoc-Limpezas.zip

    - name: Salvar Artefato (Baixar .zip)
      uses: actions/upload-artifact@v4
      with:
        name: App-Executavel-Windows
        path: InsightDoc-Limpezas.zip
